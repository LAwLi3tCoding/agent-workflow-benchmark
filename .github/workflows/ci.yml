name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Agent Workflow Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff hygiene
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Build plugin runtime
        run: npm run plugin:build

      - name: Runtime parity
        run: |
          set -euo pipefail
          runtime_changes="$(git status --porcelain=v1 --untracked-files=all -- plugins/agent-workflow-bench/runtime)"
          if [ -n "$runtime_changes" ]; then
            echo "Generated plugin runtime is out of date. Run npm run plugin:build and commit the runtime diff."
            printf '%s\n' "$runtime_changes"
            exit 1
          fi

      - name: Source schema validation
        run: npm run benchmark -- validate-schema

      - name: Packaged runtime schema validation
        run: plugins/agent-workflow-bench/bin/awb validate-schema

      - name: Canonical naming scan
        run: |
          set -euo pipefail
          legacy_slug="agent-workflow-"
          legacy_slug="${legacy_slug}benchmark"
          legacy_title="Agent Workflow "
          legacy_title="${legacy_title}Benchmark"
          if git grep -Il -e "$legacy_slug" -e "$legacy_title" -- .; then
            echo "Legacy Agent Workflow Bench naming found in the files listed above."
            exit 1
          fi
          if git ls-files | grep -F -e "$legacy_slug" -e "$legacy_title"; then
            echo "Legacy Agent Workflow Bench naming found in repository-relative paths."
            exit 1
          fi

      - name: Privacy scan
        run: |
          set -euo pipefail
          home_pattern='/(Users|home)/[[:alnum:]_.-]+/'
          key_marker='PRIVATE'
          key_pattern="BEGIN [A-Z ]* ${key_marker} KEY"
          token_prefix='sk-'
          token_pattern="${token_prefix}[A-Za-z0-9_-]{20,}"
          private_marker='internal business '
          private_marker="${private_marker}data"
          cn_marker='内部业务'
          cn_marker="${cn_marker}数据"
          blocked="$(git grep -IlE "($home_pattern|$key_pattern|$token_pattern|$private_marker|$cn_marker)" -- . || true)"
          if [ -n "$blocked" ]; then
            echo "Privacy scan found blocked private-data categories in these repository-relative files:"
            printf '%s\n' "$blocked"
            exit 1
          fi
          blocked_paths="$(git ls-files | grep -E "($home_pattern|$key_pattern|$token_pattern|$private_marker|$cn_marker)" || true)"
          if [ -n "$blocked_paths" ]; then
            echo "Privacy scan found blocked private-data categories in repository-relative paths:"
            printf '%s\n' "$blocked_paths"
            exit 1
          fi

      - name: Fresh install smoke
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/plugin"
          cp -R plugins/agent-workflow-bench "$tmp/plugin/agent-workflow-bench"
          rm -rf "$tmp/plugin/agent-workflow-bench/runtime/node_modules"
          cd "$tmp"
          ./plugin/agent-workflow-bench/bin/awb validate-schema
