schemaVersion: 0.1.0
id: dummy-cli-agent
name: Dummy CLI Agent
targetType: cli
root: fixtures/repos/dummy-cli-agent
entrypoints:
  - id: dummy-cli
    kind: cli
    command: bin/dummy-agent
roles:
  - id: cli-agent
    path: manifest.yaml
    ownerScopes: [triage, implementation, dod]
contracts:
  statuses: [PASS, FAILED, SKIPPED, ADVISORY]
  statusSemantics:
    - code: PASS
      semanticClass: pass
      scope: workflow-gate
      blocking: false
      terminal: true
      allowedTransitions: []
    - code: FAILED
      semanticClass: failure
      scope: workflow-gate
      blocking: true
      terminal: true
      allowedTransitions: []
    - code: SKIPPED
      semanticClass: skipped
      scope: workflow-gate
      blocking: false
      terminal: true
      allowedTransitions: []
    - code: ADVISORY
      semanticClass: advisory
      scope: workflow-gate
      blocking: false
      terminal: true
      allowedTransitions: []
  requiredOwners:
    implementation: cli-agent
  routing:
    forbidden:
      - id: dangerous-args
        from: cli-agent
        to: external-write
        when: args contains --prod-write
  joins: []
  artifacts:
    - id: cli-output
      path: deliverables/cli-output.json
      owner: cli-agent
  states:
    - id: cli-state
      path: process/cli-state.json
  budgets:
    wallClockSeconds: 60
    tokenTotal: 4000
commandPolicy:
  allowedExecutables: [node, bin/dummy-agent]
  forbiddenArgs: [--prod-write]
contractReview:
  status: reviewed
  reviewerId: generic-fixture-maintainer
  reviewedAt: 2026-07-25T00:00:00.000Z
  artifactPath: configs/targets/reviews/dummy-cli-agent.contract-validity.json
  artifactHash: sha256:fc96ed5a926ab09e43d53214e31993c09db03dcf4191e50cc7b248777fbdd852
